        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: #070816; }
        .nova-root {
          font-family: Arial, Helvetica, sans-serif;
          color: white;
          background: #070816;
          overflow-x: clip;
          min-height: 100vh;
          position: relative;
          isolation: isolate;
        }
        :root { --blue: #00d4ff; --purple: #a855f7; }
        .background {
          position: fixed;
          inset: 0;
          z-index: -2;
          background: linear-gradient(-45deg, #070816, #15103b, #071c32, #210d35);
          background-size: 400% 400%;
          animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        #particles {
          position: fixed;
          inset: 0;
          z-index: -1;
          pointer-events: none;
        }
        nav.nova-nav {
          position: fixed;
          top: var(--safe-area-inset-top, 0px);
          left: 0;
          width: 100%;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 22px 8%;
          background: rgba(7, 8, 22, 0.65);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo {
          font-size: 27px;
          font-weight: 900;
          letter-spacing: 3px;
          color: var(--blue);
          text-shadow: 0 0 18px var(--blue);
          cursor: default;
        }
        .nav-links a {
          color: #ddd;
          text-decoration: none;
          margin-left: 25px;
          font-size: 14px;
          transition: 0.3s;
          letter-spacing: 0.02em;
        }
        .nav-links a:hover { color: var(--blue); }
        .hero {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          text-align: center;
          padding: 120px 20px 70px;
          position: relative;
        }
        .badge {
          padding: 9px 18px;
          border: 1px solid rgba(0,212,255,0.5);
          border-radius: 40px;
          color: var(--blue);
          background: rgba(0,212,255,0.07);
          box-shadow: 0 0 20px rgba(0,212,255,0.1);
          margin-bottom: 28px;
          font-size: 12px;
          letter-spacing: 1.6px;
          font-weight: 700;
          animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-6px); }
        }
        .hero h1 {
          font-size: clamp(42px, 8vw, 88px);
          line-height: 1.08;
          letter-spacing: -3px;
          font-weight: 900;
          animation: appear 1s ease both;
        }
        @keyframes appear {
          from { opacity: 0; transform: translateY(18px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .gradient-text {
          background: linear-gradient(90deg, #00d4ff, #a855f7, #ff5fd2, #00d4ff);
          background-size: 300%;
          color: transparent;
          background-clip: text;
          -webkit-background-clip: text;
          animation: textFlow 5s linear infinite;
        }
        @keyframes textFlow {
          to { background-position: 300% center; }
        }
        .hero p {
          color: #b7bbd3;
          font-size: 17px;
          max-width: 650px;
          margin: 25px auto 32px;
          line-height: 1.9;
          animation: appear 1.5s ease both;
        }
        .buttons {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 16px;
        }
        .btn {
          display: inline-block;
          position: relative;
          padding: 15px 28px;
          color: white;
          text-decoration: none;
          font-weight: 700;
          border-radius: 10px;
          border: 1px solid rgba(0,212,255,0.65);
          background: linear-gradient(100deg, #087de0, #853cf3);
          box-shadow: 0 0 18px rgba(0,212,255,0.3);
          transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
          cursor: pointer;
          font-size: 14px;
          letter-spacing: 0.2px;
        }
        .btn:hover {
          transform: translateY(-5px) scale(1.03);
          box-shadow: 0 0 15px #00d4ff, 0 0 35px rgba(168,85,247,0.7);
        }
        .btn:active { transform: translateY(-2px) scale(1.01); }
        .btn.secondary {
          background: rgba(255,255,255,0.04);
          box-shadow: none;
          border-color: rgba(255,255,255,0.14);
        }
        .btn.secondary:hover {
          background: rgba(255,255,255,0.08);
          border-color: rgba(0,212,255,0.4);
          box-shadow: 0 0 18px rgba(0,212,255,0.12);
        }
        section.content {
          padding: 100px 8%;
          position: relative;
        }
        .section-title {
          font-size: clamp(30px, 5vw, 48px);
          text-align: center;
          margin-bottom: 15px;
          font-weight: 800;
          letter-spacing: -0.8px;
        }
        .section-desc {
          color: #b7bbd3;
          text-align: center;
          margin: 0 auto 50px;
          max-width: 620px;
          line-height: 1.8;
          font-size: 16px;
        }
        .cards {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 24px;
          max-width: 1200px;
          margin: 0 auto;
        }
        .card {
          padding: 32px 25px;
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 18px;
          background: rgba(255,255,255,0.045);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          transition: 0.35s;
          transform-style: preserve-3d;
        }
        .card:hover {
          transform: translateY(-10px);
          border-color: var(--blue);
          box-shadow: 0 0 30px rgba(0,212,255,0.12);
        }
        .card .icon { font-size: 42px; margin-bottom: 20px; line-height: 1; }
        .card h3 { margin-bottom: 12px; font-size: 22px; font-weight: 700; }
        .card p { color: #b7bbd3; line-height: 1.8; font-size: 15px; }
        .about-box {
          max-width: 850px;
          margin: auto;
          text-align: center;
          padding: 55px 30px;
          border: 1px solid rgba(168,85,247,0.35);
          border-radius: 24px;
          background: rgba(80,40,150,0.1);
          box-shadow: 0 0 55px rgba(168,85,247,0.08);
        }
        .about-box p {
          max-width: 620px;
          margin: 20px auto 28px;
          color: #c1c5d9;
          line-height: 1.9;
          font-size: 16px;
        }
        .reveal {
